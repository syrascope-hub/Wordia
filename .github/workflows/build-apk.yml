name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder (pubspec.yaml)
        run: |
          f=$(find . -name pubspec.yaml -not -path '*/.*' -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$f" ]; then
            # لم يُرفع المشروع مفكوكاً: إن وُجد ملف zip في المستودع نفكّه تلقائياً
            z=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$z" ]; then
              echo "Unzipping $z"
              mkdir -p _src
              unzip -q -o "$z" -d _src
              f=$(find _src -name pubspec.yaml -not -path '*/node_modules/*' | head -n 1)
            fi
          fi
          if [ -z "$f" ]; then
            echo "pubspec.yaml not found. Files in repo:"
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project dir: $d"
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --platforms=android --org com.astro --project-name lexi_words .
          rm -rf lib test
          cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Patch Android (permissions, desugaring, minSdk)
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tool/patch_android.py

      - name: Download fonts (Tajawal, Lalezar, Lilita One)
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tool/fetch_fonts.py

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Generate launcher icons (Wordia)
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart run flutter_launcher_icons

      - name: Analyze (does not block the build)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
        continue-on-error: true

      - name: Show analyzer errors (if any)
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: grep -E "^\s*error" analyze.log || echo "no analyzer errors"

      # توقيع ثابت: بدونه يُنشئ كل تشغيل مفتاح debug جديداً (المشغّل مؤقت)، فترفض
      # أندرويد تثبيت النسخة الجديدة فوق القديمة ويضطر المستخدم للحذف (وتضيع بياناته المحلية).
      - name: Restore persistent signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ] && echo "$DEBUG_KEYSTORE_B64" | base64 -d > /tmp/debug.keystore 2>/dev/null && [ -s /tmp/debug.keystore ]; then
            mkdir -p ~/.android
            mv /tmp/debug.keystore ~/.android/debug.keystore
            echo "Using persistent keystore"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 غير موجود: كل بناء سيحمل توقيعاً جديداً ولن يُثبَّت فوق القديم (انظر README)."
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: flutter build apk --release --dart-define=HF_TOKEN="$HF_TOKEN"

      - name: Rename APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: cp build/app/outputs/flutter-apk/app-release.apk wordia.apk

      - name: Upload analyzer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: ${{ env.PROJECT_DIR }}/analyze.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: wordia-apk
          path: ${{ env.PROJECT_DIR }}/wordia.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wordia 2.2 build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/wordia.apk
